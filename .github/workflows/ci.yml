# push / PR ごとの確認：Linux版の単体テスト・煙テスト・固定カメラの撮影、APK のビルドと16KB整列の検査
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux build, unit tests, headless shots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev libsdl2-dev ninja-build \
            mesa-vulkan-drivers libvulkan1 python3-pil python3-numpy

      - name: Cache Filament
        uses: actions/cache@v4
        with:
          path: third_party/filament/.cache
          key: filament-${{ hashFiles('tools/fetch_filament.sh') }}

      - name: Fetch Filament (linux)
        run: tools/fetch_filament.sh linux

      - name: Configure and build
        run: |
          CC=clang CXX=clang++ cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # Vulkan はソフトウェア実装（lavapipe）。速度は測れないが、描画・計測・出力の経路は全部通る
      - name: Smoke run (low preset, 1 short lap)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          build/benchdeck --headless --preset low --laps 1 --no-warmup --lap-seconds 4 --out results
          python3 - <<'EOF'
          import csv, glob, json
          j = json.load(open(sorted(glob.glob("results/*.json"))[-1]))
          assert j["valid_laps"] == 1, j
          assert j["timing_method"] == "gpu_frame_duration", j["timing_method"]
          assert j["summary"]["frames"] > 0
          rows = list(csv.reader(open(sorted(glob.glob("results/*.csv"))[-1])))
          assert rows[0][0] == "run" and len(rows) > 1
          print("smoke OK:", j["summary"])
          EOF

      - name: Fixed-camera shots (5 points)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          build/benchdeck --headless --shots shots/run1
          build/benchdeck --headless --shots shots/run2
          # 同じバイナリ・同じ入力なら画素まで一致すること（決定性）
          python3 tools/imagediff.py shots/run1 shots/run2 --threshold 99

      # ドライブ：自動運転で大通り → 高架 → 路地を最後まで走り切る（詰まらない・落ちない）。撮影と走行音も残す
      - name: Drive smoke (autopilot)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          mkdir -p drive-out
          build/citydrive --headless --demo 60 --shots drive-out --wav drive-out/drive.wav | tee drive-out/log.txt
          grep -q "finished=1" drive-out/log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: drive-demo
          path: drive-out

      - uses: actions/upload-artifact@v4
        with:
          name: linux-shots
          path: shots/run1
      - uses: actions/upload-artifact@v4
        with:
          name: linux-results
          path: results

  android:
    name: APK build and 16 KB page checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # ランナーに入っている Android SDK をそのまま使う（setup-android@v3 は廃止済みの "tools" を入れようとして落ちる）
      - name: Android SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          (yes || true) | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6" | grep -v '^\[' || true
          test -d "$ANDROID_HOME/ndk/29.0.14206865" && test -d "$ANDROID_HOME/cmake/3.31.6"

      - name: Cache Filament
        uses: actions/cache@v4
        with:
          path: third_party/filament/.cache
          key: filament-${{ hashFiles('tools/fetch_filament.sh') }}
      - name: Fetch Filament (linux tools + android libs)
        run: tools/fetch_filament.sh

      - name: Build debug APK and run JVM unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Check 16 KB alignment (bench and drive)
        run: |
          READELF=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          for APK in android/app/build/outputs/apk/debug/*.apk android/drive/build/outputs/apk/debug/*.apk; do
            echo "== $APK"
            $ANDROID_HOME/build-tools/36.0.0/zipalign -c -P 16 -v 4 "$APK" | tail -1
            rm -rf apk && unzip -o -q "$APK" 'lib/*' -d apk
            for so in apk/lib/*/*.so; do
              bad=$($READELF -lW "$so" | awk '$1=="LOAD" && $NF!="0x4000" && $NF!="0x10000"')
              if [ -n "$bad" ]; then echo "$so is not 16 KB aligned"; echo "$bad"; exit 1; fi
              echo "$so: LOAD segments 16 KB aligned"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/drive/build/outputs/apk/debug/*.apk
